<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PG Gear">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ponyground gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;1,800;1,900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F5F1;--card:#FFFFFF;--ink:#111111;--mute:#6E6E6A;--soft:#9A9893;--line:#DAD8D2;--off:#E4E2DC;--sig:#FF4A1C;--sigtext:#C2360F;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:'IBM Plex Sans KR',-apple-system,sans-serif;min-height:100vh}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 20px 0}
  /* 하단 버튼은 화면 아래에 항상 붙어 있게 (아이폰 주소창·홈바에 안 가려지게) */
  .dock{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:0 -20px;padding:10px 20px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:8px;box-shadow:0 -1px 0 var(--line)}
  .dock .cta{margin:0!important}
  .en{font-family:'Archivo',sans-serif}
  .lab{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--mute)}
  .top{display:flex;justify-content:space-between;align-items:center;min-height:32px}
  .top img{height:17px;display:block}
  .back{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:1.5px solid var(--ink);background:var(--card);font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em}
  .back svg{flex:0 0 18px}
  .top .logo{background:none;border:0;padding:8px 8px 8px 0;margin-left:0;cursor:pointer}
  .chip{display:flex;align-items:center;gap:6px;font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;padding:8px 0}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--ink)}
  h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
  .sub{font-size:14px;color:var(--mute);margin-top:6px}
  .big{font-family:'Archivo',sans-serif;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:.9}
  .card{background:var(--card);padding:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pill{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;padding:5px 10px;white-space:nowrap}
  .pill.done{background:var(--ink);color:#fff}
  .pill.left{background:var(--sig);color:var(--ink)}
  .pill.line{border:1.5px solid var(--ink);padding:4px 9px}
  .cta{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:62px;padding:0 22px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;text-align:left}
  .cta.soft{background:var(--off);color:#5E5C57}
  .cta small{font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:.14em;font-weight:700}
  .grow{flex-grow:1;min-height:20px}
  .list>div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
  .list>div:last-child{border-bottom:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;font-size:14px;width:100%;text-align:left;padding:5px 0}
  .box{width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
  .box.on{background:var(--ink)}
  .item.ok{color:var(--mute)}
  .item.ok .t{text-decoration:line-through}
  .tagx{font-size:11px;color:var(--mute);margin-left:auto;white-space:nowrap}
  .scanbar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:8px;margin-top:16px;transition:background .2s}
  .scanbar.hit{background:#1f3d22}
  .scanbar video{width:84px;height:63px;object-fit:cover;background:#333;flex:0 0 84px}
  .scanbar .msg{font-size:13px;color:#CFCFCB;line-height:1.5;min-width:0}
  .scanbar .msg b{color:#fff;font-weight:500}
  .scanzone{position:relative;height:200px;margin-top:22px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%}
  .scanzone i{position:absolute;width:22px;height:22px;border:0 solid #fff}
  .seg{display:grid;gap:2px;margin-top:14px}
  .seg span{height:6px;background:var(--line)}
  .seg span.on{background:var(--ink)}
  .missing{background:var(--sig);color:var(--ink);padding:20px;margin-top:20px}
  .missing .list>div{border-color:var(--ink);border-width:1.5px}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--ink);background:#fff;border-radius:0;outline:none}
  .opt{width:100%;text-align:left;background:var(--card);padding:16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .opt.sel{outline:2px solid var(--ink)}
  .sheet{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet .panel{background:var(--bg);width:100%;max-width:480px;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:80vh;overflow:auto}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .err{color:var(--sigtext);font-size:14px;margin-top:12px}
  .linkbtn{font-size:13px;color:var(--mute);text-decoration:underline;padding:10px 0}
  .stack{display:flex;flex-direction:column;gap:8px}
  .curbag{outline:2px solid var(--ink)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

/* ---------- 저장 (폰에 기억) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pg_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pg_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pg_' + k); } catch (e) {} }
};

/* ---------- 상태 ---------- */
let D = null;            // 서버 데이터
let G = {};              // id -> gear
let BAG_OF_CASE = {};    // 케이스명 -> 가방 장비 id
let S = { view: 'loading', who: store.get('who', null), shoot: null, sess: null, error: '' };

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const name = id => (G[id] ? G[id].model : id);
const isBag = id => G[id] && G[id].cat === '가방';
const bagName = id => (id && G[id] ? G[id].box || G[id].model : '가방 없이');

/* ---------- API ---------- */
async function apiGet(action) {
  const r = await fetch(API + '?action=' + action + '&token=' + TOKEN);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '서버 오류');
  return j;
}
async function apiPost(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: TOKEN }, body)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '서버 오류');
  return j;
}

async function load() {
  S.view = 'loading'; render();
  try {
    D = await apiGet('bootstrap');
    if (!D.version || D.version < 3) throw new Error('Apps Script가 예전 버전이에요. Apps Script에서 새 코드 붙여넣고 [배포 관리 → 편집 → 새 버전]으로 배포해줘.');
    D.events = D.events || []; D.today = D.today || new Date().toISOString().slice(0, 10);
    G = {}; BAG_OF_CASE = {};
    D.gear.forEach(g => { G[g.id] = g; if (g.cat === '가방' && g.box) BAG_OF_CASE[g.box] = g.id; });
    const saved = store.get('shoot', null);
    const sv = saved ? D.shoots.find(s => s.id === saved.id) : null;
    // 고른 촬영은 날짜가 지나고 철수까지 끝나면 자동으로 해제
    S.shoot = sv && !(sv.returnedAt && sv.date < D.today) && !(sv.date < D.today && !sv.departedAt) ? sv : null;
    S.view = S.who ? 'home' : 'who';
  } catch (e) {
    S.view = 'error'; S.error = e.message;
  }
  render();
}

/* ---------- 계산 ---------- */
function recs(shootId, type) { return D.records.filter(r => r.shootId === shootId && r.type === type); }
function shootStatus(sh) {
  if (!sh) return 'none';
  if (sh.returnedAt) return 'done';
  if (sh.departedAt) return 'out';
  return 'ready';
}
function missingOf(sh) {
  const back = new Set(recs(sh.id, '철수').map(r => r.gearId));
  return recs(sh.id, '출발').filter(r => !back.has(r.gearId)).map(r => r.gearId);
}
function lastFinished() {
  return D.shoots.filter(s => s.returnedAt && (!S.shoot || s.id !== S.shoot.id))
    .sort((a, b) => b.returnedAt.localeCompare(a.returnedAt))[0] || null;
}
function oftenLeft() {
  const cnt = {};
  D.shoots.filter(s => s.returnedAt).forEach(s => missingOf(s).forEach(id => { if (!isBag(id)) cnt[id] = (cnt[id] || 0) + 1; }));
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 3);
}
const contentsOf = bagId => D.gear.filter(g => g.cat !== '가방' && g.box && G[bagId] && g.box === G[bagId].box);

/* ---------- 스캔 (카메라 + NFC) ---------- */
const scanner = {
  stream: null, running: false, last: 0, canvas: document.createElement('canvas'), audio: null, nfc: null,
  async start(video) {
    try { this.audio = this.audio || new (window.AudioContext || window.webkitAudioContext)(); if (this.audio.state === 'suspended') await this.audio.resume(); } catch (e) {}
    if (this.stream) { video.srcObject = this.stream; await video.play().catch(() => {}); return true; }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) { toast('카메라를 열 수 없어요. 권한을 확인해줘'); return false; }
    video.srcObject = this.stream; await video.play().catch(() => {});
    this.running = true; this.video = video;
    const ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    const tick = now => {
      if (!this.running) return;
      requestAnimationFrame(tick);
      const v = this.video;
      if (!v || now - this.last < 120 || v.readyState < 2 || !v.videoWidth) return;
      this.last = now;
      const sc = Math.min(1, 640 / v.videoWidth);
      this.canvas.width = v.videoWidth * sc; this.canvas.height = v.videoHeight * sc;
      ctx.drawImage(v, 0, 0, this.canvas.width, this.canvas.height);
      const img = ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
      const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (r && r.data) onCode(r.data);
    };
    requestAnimationFrame(tick);
    return true;
  },
  attach(video) { this.video = video; if (this.stream) { video.srcObject = this.stream; video.play().catch(() => {}); } },
  stop() { this.running = false; if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; },
  async startNfc() {
    if (!('NDEFReader' in window)) { toast('이 폰은 NFC 웹 기능을 지원하지 않아요'); return; }
    try {
      this.nfc = new NDEFReader();
      await this.nfc.scan();
      this.nfc.onreading = ev => {
        let code = '';
        for (const rec of ev.message.records) {
          if (rec.recordType === 'text') { code = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data); break; }
          if (rec.recordType === 'url') { const u = new TextDecoder().decode(rec.data); code = u.split(/[\/=#?]/).pop(); break; }
        }
        if (code) onCode(code); else toast('태그에 장비 ID가 없어요');
      };
      S.nfcOn = true; toast('NFC 켜짐 · 태그에 폰을 대주세요'); render();
    } catch (e) { toast('NFC를 켤 수 없어요: ' + (e.message || e.name)); }
  },
  beep(ok) {
    try {
      const a = this.audio; if (!a) return;
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = ok ? 1250 : 380; g.gain.value = .14;
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? .07 : .18));
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 50 : [80, 60, 80]);
  }
};

let lastCode = '', lastCodeAt = 0;
function onCode(raw) {
  const id = String(raw).trim().toUpperCase();
  const now = Date.now();
  if (id === lastCode && now - lastCodeAt < 1500) return;  // 같은 태그 연속 인식 방지
  lastCode = id; lastCodeAt = now;
  if (!G[id]) { scanner.beep(false); flashMsg('등록 안 된 코드 · ' + esc(id), false); return; }
  if (S.view === 'depart') departScan(id);
  else if (S.view === 'return') returnScan(id);
}

/* ---------- 출발 ---------- */
function newDepart(prefill) {
  const s = { bags: [], cur: null, assigned: {}, order: [], lastMsg: '', add: !!prefill, prior: {} };   // assigned: 장비id -> 가방id|''
  if (prefill) {
    recs(S.shoot.id, '출발').forEach(r => {
      s.prior[r.gearId] = true;
      if (isBag(r.gearId)) { if (!s.bags.includes(r.gearId)) s.bags.push(r.gearId); }
      else if (G[r.gearId] && (G[r.gearId].tag || !r.bag || !contentsOf(r.bag).some(g => g.id === r.gearId))) s.assigned[r.gearId] = r.bag || '';
    });
    s.lastMsg = '이미 챙긴 장비는 체크돼 있어요. 추가할 것만 찍으면 돼요';
  }
  return s;
}
function departScan(id) {
  const s = S.sess;
  if (isBag(id)) {
    const fresh = !s.bags.includes(id);
    (s.hist = s.hist || []).push({ kind: 'bag', id, fresh, prevCur: s.cur });
    if (fresh) s.bags.push(id);
    s.cur = id;
    scanner.beep(true);
    flashMsg((fresh ? '가방 · ' : '현재 가방 · ') + '<b>' + esc(bagName(id)) + '</b>', true);
  } else {
    if (id in s.assigned) { scanner.beep(true); flashMsg('이미 찍음 · <b>' + esc(name(id)) + '</b>', true); render(); return; }
    const home = BAG_OF_CASE[G[id].box];
    const bag = home && s.bags.includes(home) ? home : (s.cur || '');
    s.assigned[id] = bag;
    s.order.push(id);
    (s.hist = s.hist || []).push({ kind: 'item', id });
    scanner.beep(true);
    flashMsg('<b>' + esc(name(id)) + '</b> → ' + esc(bagName(bag)), true);
  }
  render();
}
function departModel() {
  const s = S.sess;
  const groups = s.bags.map(b => {
    const items = [];
    contentsOf(b).forEach(g => {
      if (!g.tag) items.push({ id: g.id, ok: true, auto: true });
      else if (s.assigned[g.id] === undefined || s.assigned[g.id] === b) items.push({ id: g.id, ok: s.assigned[g.id] === b });
    });
    Object.keys(s.assigned).filter(i => s.assigned[i] === b && !items.some(x => x.id === i))
      .forEach(i => items.push({ id: i, ok: true, extra: true }));
    return { bag: b, items };
  });
  const loose = Object.keys(s.assigned).filter(i => !s.assigned[i]).map(i => ({ id: i, ok: true, extra: true }));
  const all = groups.flatMap(g => g.items).concat(loose);
  return { groups, loose, total: all.length, done: all.filter(i => i.ok).length, left: all.filter(i => !i.ok) };
}
// QR/NFC 없이 직접 체크 (가방에 이미 넣은 경우)
function manualDepart(id, bag) {
  const s = S.sess;
  s.assigned[id] = bag || ''; s.order.push(id);
  (s.manual = s.manual || {})[id] = true;
  (s.hist = s.hist || []).push({ kind: 'item', id });
  flashMsg('직접 체크 · <b>' + esc(name(id)) + '</b>', true); render();
}
function manualReturn(id) {
  const s = S.sess;
  (s.hist = s.hist || []).push({ before: Object.assign({}, s.back), manualBefore: Object.assign({}, s.manual || {}) });
  s.back[id] = true; (s.manual = s.manual || {})[id] = true;
  if (isBag(id)) s.expected.filter(e => e.bag === id && G[e.id] && !G[e.id].tag).forEach(e => { s.back[e.id] = true; });
  flashMsg('직접 체크 · <b>' + esc(isBag(id) ? bagName(id) : name(id)) + '</b>', true); render();
}

// 방금 찍은 것 취소 (출발·철수 공통)
function undoLast() {
  const s = S.sess, h = (s.hist || []).pop();
  if (!h) { toast('취소할 스캔이 없어요'); return; }
  if (S.view === 'return') { s.back = h.before; if (h.manualBefore) s.manual = h.manualBefore; flashMsg('방금 체크 취소', true); render(); return; }
  if (h.kind === 'item') { removeItem(h.id); if (s.manual) delete s.manual[h.id]; flashMsg('취소 · <b>' + esc(name(h.id)) + '</b>', true); }
  else { if (h.fresh) dropBag(h.id); s.cur = h.prevCur && s.bags.includes(h.prevCur) ? h.prevCur : (s.bags[s.bags.length - 1] || null); flashMsg('취소 · <b>' + esc(bagName(h.id)) + '</b>', true); }
  render();
}
function removeItem(id) {
  const s = S.sess;
  if (s.prior[id]) { toast('이미 저장된 장비는 여기서 뺄 수 없어요'); return false; }
  delete s.assigned[id]; s.order = s.order.filter(i => i !== id);
  if (s.hist) s.hist = s.hist.filter(h => !(h.kind === 'item' && h.id === id));
  return true;
}
function dropBag(b) {
  const s = S.sess;
  if (s.prior[b]) { toast('이미 저장된 가방은 여기서 뺄 수 없어요'); return false; }
  s.bags = s.bags.filter(x => x !== b);
  Object.keys(s.assigned).forEach(i => { if (s.assigned[i] === b) s.assigned[i] = ''; });   // 안에 넣었던 장비는 "가방 없이"로
  if (s.cur === b) s.cur = s.bags[s.bags.length - 1] || null;
  if (s.hist) s.hist = s.hist.filter(h => h.id !== b);
  return true;
}
function bagMenu(b) {
  const s = S.sess;
  openSheet('<div class="lab">가방</div><h1 style="font-size:22px">' + esc(bagName(b)) + '</h1>' +
    (s.cur !== b ? '<button class="opt" data-cur="1">현재 가방으로 만들기</button>' : '') +

      el.querySelector('[data-drop]').onclick = () => { if (dropBag(b)) toast(bagName(b) + ' 취소'); closeSheet(); render(); };
    });
}
function moveItem(id) {

      el.querySelector('[data-rm]').onclick = () => { if (removeItem(id)) toast(name(id) + ' 취소'); closeSheet(); render(); };

/* ---------- 철수 ---------- */
function newReturn() {
  const dep = recs(S.shoot.id, '출발');
  const uniq = {}; dep.forEach(r => { uniq[r.gearId] = r.bag; });   // 같은 장비가 두 번 기록돼도 1번만
  return { expected: Object.keys(uniq).map(id => ({ id, bag: uniq[id] })), back: {}, extra: [], lastMsg: '' };
}
function returnScan(id) {
  const s = S.sess;
  const exp = s.expected.find(e => e.id === id);
  const before = Object.assign({}, s.back);
  if (exp) (s.hist = s.hist || []).push({ before });
  if (isBag(id) && exp) {
    s.back[id] = true;
    s.expected.filter(e => e.bag === id && G[e.id] && !G[e.id].tag).forEach(e => { s.back[e.id] = true; });
    scanner.beep(true); flashMsg('가방 회수 · <b>' + esc(bagName(id)) + '</b>', true);
  } else if (exp) {
    s.back[id] = true; scanner.beep(true); flashMsg('<b>' + esc(name(id)) + '</b> 회수', true);
  } else {
    scanner.beep(false); flashMsg('출발 때 없던 장비 · <b>' + esc(name(id)) + '</b>', false);
  }
  render();
}
function returnModel() {
  const s = S.sess;
  const bags = [...new Set(s.expected.map(e => e.bag))];
  const groups = bags.map(b => {
    const items = s.expected.filter(e => e.bag === b && e.id !== b);
    return { bag: b, items, left: items.filter(e => !s.back[e.id]).length + (b && s.expected.some(e => e.id === b) && !s.back[b] ? 1 : 0) };
  });
  const miss = s.expected.filter(e => !s.back[e.id]);
  const items = s.expected.filter(e => !isBag(e.id));
  return { groups, miss, total: items.length, now: items.filter(e => s.back[e.id]).length };
}

/* ---------- 저장 ---------- */
async function finish(type, force) {
  const who = S.who;
  let items, summary, alert = false;
  if (type === '출발') {
    const m = departModel(), s = S.sess;
    items = s.bags.map(b => ({ id: b, bag: b }));
    m.groups.forEach(g => g.items.filter(i => i.ok).forEach(i => items.push({ id: i.id, bag: g.bag })));
    m.loose.forEach(i => items.push({ id: i.id, bag: '' }));
    const added = items.filter(i => !s.prior[i.id]).map(i => name(i.id));
    if (s.add) {
      if (!added.length) { toast('새로 추가한 장비가 없어요'); return; }
      summary = '추가 ' + added.length + '개: ' + added.join(', ') + '\n총 장비 ' + m.done + '개';
    } else {
      summary = '가방 ' + s.bags.length + '개 · 장비 ' + m.done + '개 챙김';
      if (m.left.length) { summary += '\n두고 출발: ' + m.left.map(i => name(i.id)).join(', '); }
    }
    const man = Object.keys(s.manual || {}); if (man.length) summary += '\n직접 체크 ' + man.length + '개: ' + man.map(name).join(', ');
  } else {
    const m = returnModel(), s = S.sess;
    items = s.expected.filter(e => s.back[e.id]).map(e => ({ id: e.id, bag: e.bag }));
    if (m.miss.length) { alert = true; summary = '⚠ 못 찾은 장비 ' + m.miss.length + '개: ' + m.miss.map(e => name(e.id) + '(' + bagName(e.bag) + ')').join(', '); }
    else summary = '출발한 장비 ' + m.total + '개 전부 회수 · 0 MISSING';
    const man = Object.keys(s.manual || {}).filter(i => s.back[i]); if (man.length) summary += '\n직접 체크 ' + man.length + '개: ' + man.map(i => isBag(i) ? bagName(i) : name(i)).join(', ');
  }
  S.saving = true; render();
  try {
    await apiPost({ action: 'finish', shootId: S.shoot.id, type, items, who, summary, alert, noNotify: true });
    const label = type === '출발' && S.sess.add ? '출발 장비 추가' : type + ' 완료';
    const sent = await pushNotify(S.shoot.name + ' ' + label + ' · ' + who, summary, type, alert);
    toast(label + ' · ' + (sent === true ? '알림 보냄' : '알림 실패 (' + sent + ')'));
    S.saving = false; S.sess = null;
    scanner.stop(); S.nfcOn = false;
    await load();
  } catch (e) {
    S.saving = false; toast('저장 실패: ' + e.message + ' · 다시 눌러줘'); render();
  }
}

/* ---------- 알림 (폰에서 ntfy로 직접 전송) ---------- */
const NTFY_TOPIC = 'pg-gear-e7lorzvrhx2v8q';
async function pushNotify(title, message, type, alert) {
  try {
    const url = 'https://ntfy.sh/' + NTFY_TOPIC + '?title=' + encodeURIComponent(title) +
      '&tags=' + (type === '출발' ? 'truck' : 'house') + '&priority=' + (alert ? 4 : 3);
    const r = await fetch(url, { method: 'POST', body: message });
    return r.ok ? true : r.status;
  } catch (e) { return e.message || 'network'; }
}

  rows.forEach(r => { if (r.date !== lastDate) { list += '<div class="lab" style="margin-top:18px">' + esc(dateLabel(r.date)) + '</div>'; lastDate = r.date; } list += r.html; });
  $app.innerHTML = topbar(backBtn('BACK')) +
    '<div class="lab" style="margin-top:32px">다가오는 촬영 · ' + (D.days || 30) + '일</div><h1>어떤 촬영이야?</h1>' +
    '<div style="margin-top:4px">' + list + '</div>' +
    (D.eventsError ? '<div class="err">캘린더를 못 읽었어요: ' + esc(D.eventsError) + '<br>Apps Script 편집기에서 authorize 함수를 한 번 실행해서 권한을 허용해줘.</div>' : '') +
    (!rows.length && !D.eventsError ? '<div class="sub">다가오는 촬영 일정이 없어요</div>' : '') +
    '<div class="lab" style="margin-top:28px">직접 입력</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="nm" placeholder="촬영명" style="flex:1"><input type="date" id="dt" value="' + D.today + '" style="font:inherit;font-size:15px;padding:12px;border:1.5px solid var(--ink);background:#fff;border-radius:0"></div>' +
    '<button class="cta" style="margin-top:8px" id="mk"><span>추가</span></button>' +
    '<div class="err" id="perr"></div>';
  document.getElementById('back').onclick = () => { S.view = 'home'; render(); };
  const choose = sh => { S.shoot = sh; store.set('shoot', { id: sh.id, date: sh.date }); S.view = 'home'; render(); };
  $app.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => choose(D.shoots.find(s => s.id === b.dataset.sid)));
  const open = async body => {
    document.getElementById('perr').textContent = '';
    try {
      const j = await apiPost(Object.assign({ action: 'openShoot' }, body));
      if (!D.shoots.some(s => s.id === j.shoot.id)) D.shoots.unshift(j.shoot);
      choose(j.shoot);
    } catch (e) { document.getElementById('perr').textContent = '저장 실패: ' + e.message; }
  };
  $app.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { const e = evs[+b.dataset.ev]; open({ name: e.title, calId: e.calId, date: e.date }); });
  document.getElementById('mk').onclick = () => { const n = document.getElementById('nm').value.trim(); const dt = document.getElementById('dt').value || D.today; if (n) open({ name: n, date: dt }); };
}

function scanBar(defaultMsg) {
  const nfc = 'NDEFReader' in window;
  return '<div class="scanbar" id="sbar"><video id="cam" playsinline muted></video><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:var(--sig)"></span><span class="lab" style="color:#fff;font-size:10px">SCANNING' + (S.nfcOn ? ' · NFC' : '') + '</span></div><div class="msg" id="smsg">' + (S.sess.lastMsg || defaultMsg) + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' + (nfc && !S.nfcOn ? '<button class="pill line" id="nfc" style="color:#fff;border-color:#fff">NFC</button>' : '') +
    '<button class="pill line" id="undo" style="color:#fff;border-color:#fff" aria-label="방금 스캔 취소">취소</button></div></div>';
}

function renderDepart() {
  const m = departModel(), s = S.sess;
  const segN = Math.max(m.total, 1);
  $app.innerHTML = topbar(backBtn(s.add ? '추가 중' : '출발 체크')) +
    '<div class="row" style="margin-top:20px;align-items:flex-end"><div><div class="sub" style="margin:0">' + (s.add ? '추가로 챙기는 중' : '짐 싸는 중') + ' · ' + esc(S.shoot.name) + '</div>' +
    '<div style="display:flex;align-items:baseline;gap:4px;margin-top:2px"><span class="big" style="font-size:88px">' + m.done + '</span><span class="big" style="font-size:30px;color:var(--soft);font-weight:800">/' + m.total + '</span></div></div>' +
    '<div class="lab" style="color:' + (m.left.length ? 'var(--sigtext)' : 'var(--ink)') + ';padding-bottom:8px">' + (m.left.length ? m.left.length + ' LEFT' : (m.total ? 'ALL SET' : 'START')) + '</div></div>' +
    '<div class="seg" style="grid-template-columns:repeat(' + segN + ',minmax(0,1fr))">' + Array.from({ length: segN }, (_, i) => '<span class="' + (i < m.done ? 'on' : '') + '"></span>').join('') + '</div>' +
    scanBar('가방부터 찍고, 그다음 장비를 찍어요') +
    '<div class="stack" style="margin-top:14px">' +
    m.groups.map(g => {
      const left = g.items.filter(i => !i.ok).length;
      return '<div class="card' + (s.cur === g.bag ? ' curbag' : '') + '"><div class="row"><button data-bag="' + g.bag + '" style="text-align:left"><div style="font-size:17px;font-weight:700">' + esc(bagName(g.bag)) + (s.cur === g.bag ? ' <span class="lab" style="font-size:9px">· 현재 가방</span>' : '') + '</div><div style="font-size:13px;color:var(--mute);margin-top:2px">' + g.items.length + '개 · 탭해서 취소/선택</div></button>' +
        (left ? '<span class="pill left">' + left + ' LEFT</span>' : '<span class="pill done">DONE</span>') + '</div>' +
        (g.items.length ? '<div style="margin-top:10px">' + g.items.filter(i => !i.auto).map(i => itemRow(i, g.bag)).join('') +
          (g.items.some(i => i.auto) ? '<div class="item ok"><span class="box on">' + chk() + '</span><span class="t">태그 없는 장비 ' + g.items.filter(i => i.auto).length + '개</span><span class="tagx">가방과 함께</span></div>' : '') + '</div>' : '') +
        '</div>';
    }).join('') +
    (m.loose.length ? '<div class="card"><div class="row"><div style="font-size:17px;font-weight:700">가방 없이</div><span class="pill done">' + m.loose.length + '</span></div><div style="margin-top:10px">' + m.loose.map(i => itemRow(i)).join('') + '</div></div>' : '') +
    (!m.groups.length && !m.loose.length ? '<div class="card" style="color:var(--mute);font-size:14px">아직 찍은 게 없어요</div>' : '') +
    '</div><div class="grow"></div><div class="dock">' +
    (m.left.length
      ? '<button class="cta soft" id="fin"><span>' + (S.saving ? '저장 중…' : m.left.length + '개 남음 · ' + (s.add ? '추가 저장' : '이대로 출발')) + '</span><small>TAP</small></button>'
      : '<button class="cta" id="fin"' + (m.total ? '' : ' disabled') + '><span>' + (S.saving ? '저장 중…' : (s.add ? '추가 저장' : '출발 완료')) + '</span>' + arrow() + '</button>') + '</div>';
  bindCheckCommon();
  $app.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { const id = b.dataset.it;
    if (S.sess.assigned[id] === undefined) { manualDepart(id, b.dataset.in); return; } if (S.sess.prior[id]) { toast('이미 저장된 장비예요'); return; } moveItem(id); });
  $app.querySelectorAll('[data-bag]').forEach(b => b.onclick = () => { if (S.sess.prior[b.dataset.bag]) { toast('이미 저장된 가방이에요'); return; } bagMenu(b.dataset.bag); });
  document.getElementById('fin').onclick = () => {
    if (S.saving || !m.total) return;
    if (m.left.length && !s.add) confirmSheet(m.left.length + '개를 두고 출발할까?', m.left.map(i => name(i.id)).join(', '), '이대로 출발', () => finish('출발'));
    else finish('출발');
  };
}
function itemRow(i, bag) {
  return '<button class="item' + (i.ok ? ' ok' : '') + '" data-it="' + i.id + '" data-in="' + (bag || '') + '"><span class="box' + (i.ok ? ' on' : '') + '">' + (i.ok ? chk() : '') + '</span><span class="t">' + esc(name(i.id)) + '</span>' + (i.ok && S.sess.assigned[i.id] !== undefined && !S.sess.prior[i.id] ? '<span class="tagx">' + (i.extra ? '+ 추가 · ' : '') + '탭: 취소</span>' : '') + (!i.ok ? '<span class="tagx">탭: 직접 체크</span>' : '') + (S.sess.manual && S.sess.manual[i.id] ? '<span class="tagx">직접 체크</span>' : '') + '</button>';
}
function chk() { return '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3"></path></svg>'; }

function renderReturn() {
  const m = returnModel(), s = S.sess;
  $app.innerHTML = topbar(backBtn('철수 체크')) +
    '<h1 style="margin-top:20px">철수 확인</h1>' +
    '<div class="sub" style="display:flex;gap:8px;align-items:center"><span>출발 ' + m.total + '개</span><span>→</span><b style="color:var(--ink)">지금 ' + m.now + '개</b></div>' +
    scanBar('가방을 찍으면 태그 없는 장비는 같이 회수돼요') +
    (m.miss.length
      ? '<div class="missing"><div class="row" style="align-items:flex-end"><span class="big" style="font-size:80px">' + m.miss.length + '</span><span class="lab" style="color:var(--ink)">NOT SCANNED</span></div><div style="margin-top:10px;font-size:16px;font-weight:700">아직 안 찍힌 장비</div><div class="list" style="margin-top:10px">' +
        m.miss.map(e => '<div><button data-man="' + e.id + '" style="display:flex;align-items:center;gap:10px;flex:1;text-align:left;font-weight:500;font-size:15px"><span class="box" style="border-color:var(--ink)"></span>' + esc(name(e.id)) + '</button><span style="font-size:12px">' + esc(isBag(e.id) ? '가방' : bagName(e.bag)) + '</span></div>').join('') + '</div><div style="margin-top:10px;font-size:12px">이미 가방에 넣었으면 탭해서 직접 체크</div></div>'
      : '<div class="card" style="margin-top:20px"><div class="big" style="font-size:56px">0</div><div class="lab" style="margin-top:8px">MISSING · 전부 회수</div></div>') +
    '<div class="lab" style="margin-top:20px">CASES</div><div class="stack" style="margin-top:8px">' +
    m.groups.map(g => '<div class="card row" style="padding:15px 16px"><div style="font-size:16px;font-weight:700">' + esc(bagName(g.bag)) + '</div>' + (g.left ? '<span class="pill left">' + g.left + ' LEFT</span>' : '<span class="pill done">BACK</span>') + '</div>').join('') +
    '</div><div class="grow"></div><div class="dock">' +
    (m.miss.length
      ? '<button class="cta soft" id="fin"><span>' + (S.saving ? '저장 중…' : m.miss.length + '개 찾아야 완료') + '</span><small>확인 후 완료</small></button>'
      : '<button class="cta" id="fin"><span>' + (S.saving ? '저장 중…' : '철수 완료') + '</span>' + arrow() + '</button>') + '</div>';
  bindCheckCommon();
  $app.querySelectorAll('[data-man]').forEach(b => b.onclick = () => manualReturn(b.dataset.man));
  document.getElementById('fin').onclick = () => {
    if (S.saving) return;
    if (m.miss.length) confirmSheet(m.miss.length + '개를 못 찾은 채로 끝낼까?', '두 사람 모두에게 못 찾은 장비 알림이 가요.', '확인 후 완료', () => finish('철수'));
    else finish('철수');
  };
}

function bindCheckCommon() {
  document.getElementById('back').onclick = goHome;
  const v = document.getElementById('cam'); if (v) scanner.attach(v);
  const n = document.getElementById('nfc'); if (n) n.onclick = () => scanner.startNfc();
  const u = document.getElementById('undo'); if (u) u.onclick = undoLast;
}
async function startCam() { const v = document.getElementById('cam'); if (v) await scanner.start(v); }

/* ---------- 작은 UI ---------- */
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1800); }
function flashMsg(html, ok) {
  if (S.sess) S.sess.lastMsg = html;
  const m = document.getElementById('smsg'); if (m) m.innerHTML = html;
  const b = document.getElementById('sbar'); if (b && ok) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 250); }
}
let sheetEl = null;
function openSheet(html, bind) {
  closeSheet();
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.innerHTML = '<div class="panel">' + html + '<button class="opt" data-close="1" style="justify-content:center;color:var(--mute)">닫기</button></div>';
  sheetEl.onclick = e => { if (e.target === sheetEl || e.target.dataset.close) closeSheet(); };
  document.body.appendChild(sheetEl);
  if (bind) bind(sheetEl);
}
function closeSheet() { if (sheetEl) sheetEl.remove(); sheetEl = null; }
function confirmSheet(title, body, okLabel, onOk) {
  openSheet('<h1 style="font-size:22px">' + esc(title) + '</h1><div class="sub">' + esc(body) + '</div><button class="cta" data-ok="1" style="margin-top:18px"><span>' + esc(okLabel) + '</span></button>', el => {
    el.querySelector('[data-ok]').onclick = () => { closeSheet(); onOk(); };
  });
}

if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
window.__test = { onCode, get S() { return S; }, get D() { return D; } };
load();
</script>
</body>
</html>
